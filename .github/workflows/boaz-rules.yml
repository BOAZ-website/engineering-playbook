# BOAZ 협업 규칙 검사 재사용 워크플로 원본(workflow_call). 직접 실행되지 않음
# 모든 저장소가 같은 규칙을 쓰도록 이 파일 하나만 고치고 v1 태그를 옮김
# 호출 파일 견본: tools/callers/boaz-rules.yml (저장소마다 .github/workflows/boaz-rules.yml로 복사)
# 규칙: conventions/issue-pr.md, conventions/git.md
#
# issue 잡(이슈 이벤트): 담당자=작성자, 작업 종류 라벨, Type 자동 지정. Priority 등 누락은 마커 댓글 1개로 알리고 채워지면 접음
# pr 잡(PR·리뷰·댓글·연결 이슈 편집): 제목 [Type] 9종, 라벨 자동, Assignee 자동, 대상 브랜치,
#   Closes 1개, Reviewer, 미체크 항목의 사유 댓글 → 커밋 상태 pr-rules(룰셋 필수 검사)
name: BOAZ Rules (reusable)

on:
  workflow_call:

jobs:
  issue:
    name: 이슈 규칙
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const MARK = '<!-- issue-check -->';
            const LABELS = { feat: '⭐️ FEAT', fix: '🐛 FIX', hotfix: '🚑 HOTFIX', docs: '✏️ DOCS', refactor: '🛠️ REFACTOR',
                             style: '🧁 STYLE', test: '🔎 TEST', release: '🚀 RELEASE', chore: '🧹 CHORE' };
            const TYPE_OF = { '⭐️ FEAT': 'Feature', '🐛 FIX': 'Bug', '🚑 HOTFIX': 'Bug' };

            // 생성 직후에는 new-issue.sh가 필드를 채우는 중이므로 생성 2분 뒤까지 기다림
            const age = Date.now() - new Date(context.payload.issue.created_at);
            if (age < 120000) await new Promise(r => setTimeout(r, 120000 - age));

            const q = await github.graphql(`query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){issue(number:$n){id title author{login}
                assignees(first:5){totalCount} labels(first:20){nodes{name}} issueType{name}}}}`,
              { o: owner, r: repo, n: number });
            const issue = q.repository.issue;
            const missing = [];
            let priErr = null;

            if (issue.assignees.totalCount === 0 && issue.author) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [issue.author.login] });
            }

            let typeLabel = issue.labels.nodes.map(l => l.name).find(n => Object.values(LABELS).includes(n));
            if (!typeLabel) {
              const m = issue.title.match(/^\[([A-Za-z]+)\]/);
              typeLabel = m && LABELS[m[1].toLowerCase()];
              if (typeLabel) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [typeLabel] });
              else missing.push('제목 접두어와 작업 종류 라벨(`[Feat]`·`[Fix]`·`[Docs]`·`[Chore]` 등)');
            }

            if (!issue.issueType) {
              try {
                const t = await github.graphql(`query($o:String!){organization(login:$o){issueTypes(first:10){nodes{id name}}}}`, { o: owner });
                const want = TYPE_OF[typeLabel] || 'Task';
                const id = t.organization.issueTypes.nodes.find(x => x.name === want)?.id;
                await github.graphql(`mutation($i:ID!,$t:ID!){updateIssue(input:{id:$i,issueTypeId:$t}){clientMutationId}}`, { i: issue.id, t: id });
              } catch (e) { missing.push('Type(Feature·Bug·Task)'); }
            }

            try {
              const f = await github.graphql(`query($i:ID!){node(id:$i){... on Issue{issueFieldValues(first:10){nodes{
                ... on IssueFieldSingleSelectValue{field{... on IssueFieldSingleSelect{name}}}}}}}}`, { i: issue.id });
              if (!f.node.issueFieldValues.nodes.some(v => v.field?.name === 'Priority')) missing.push('Priority(사이드바 Fields)');
            } catch (e) {
              priErr = e;
              missing.push('Priority(조회 실패)');
            }

            // 봇 댓글은 마커로 찾아 하나만 갱신함
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const existing = all.find(c => c.user?.type === 'Bot' && c.body.startsWith(MARK));
            const RESOLVED = `${MARK}\n필수 값이 모두 채워졌습니다(해결됨).`;

            if (missing.length) {
              const body = `${MARK}\n` +
                `@${issue.author.login} 이슈 필수 값이 비어 있습니다: ${missing.join(', ')}.\n` +
                `보드 "BOAZ-website project" 편입과 Project 값도 확인해 주세요. ` +
                `AI로 만들 때는 engineering-playbook \`tools/new-issue.sh\`를 쓰면 한 번에 지정됩니다(\`conventions/issue-pr.md\` "이슈").`;
              if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              } else {
                if (existing.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                // 해결됨으로 접었던 댓글이 다시 필요해졌으면 펼침
                try {
                  await github.graphql(`mutation($i:ID!){unminimizeComment(input:{subjectId:$i}){clientMutationId}}`, { i: existing.node_id });
                } catch (e) { core.warning('댓글 펼치기 실패: ' + e.message); }
              }
            } else if (existing && existing.body !== RESOLVED) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: RESOLVED });
              await github.graphql(`mutation($i:ID!){minimizeComment(input:{subjectId:$i,classifier:RESOLVED}){clientMutationId}}`, { i: existing.node_id });
            }

            if (priErr) core.setFailed('Priority 조회 실패: ' + priErr.message);

  pr:
    name: PR 규칙
    if: github.event_name != 'issues' || github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo, p = context.payload;
            const norm = s => s.replace(/[`*_]/g, '').replace(/\s+/g, ' ').trim();
            const items = b => (b || '').replace(/<!--[\s\S]*?-->/g, '').replace(/```[\s\S]*?```/g, '').split('\n').map(l => l.match(/^\s*[-*] \[ \]\s+(\S.*)$/)).filter(Boolean).map(m => norm(m[1]));
            const reasons = cs => cs.filter(c => c.user?.type !== 'Bot').flatMap(c => (c.body || '').split('\n')).map(norm).filter(l => l.startsWith('사유:'));
            const uncovered = (its, rs) => its.filter(i => !rs.some(r => r.includes(i.slice(0, 30))));
            const comments = (o, r, n) => github.paginate(github.rest.issues.listComments, { owner: o, repo: r, issue_number: n });

            // 검사할 PR 번호 결정
            let nums = [];
            if (p.pull_request) nums = [p.pull_request.number];
            else if (p.issue?.pull_request) nums = [p.issue.number];
            else if (p.issue) {
              const r = await github.graphql(`query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){
                closedByPullRequestsReferences(first:5,includeClosedPrs:false){nodes{number state repository{nameWithOwner}}}}}}`,
                { o: owner, r: repo, n: p.issue.number });
              nums = r.repository.issue.closedByPullRequestsReferences.nodes
                .filter(x => x.state === 'OPEN' && x.repository.nameWithOwner === `${owner}/${repo}`).map(x => x.number);
            }

            const CLOSES = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+(?:([\w.-]+)\/([\w.-]+))?#(\d+)/gi;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            for (const n of nums) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              const exempt = /^\[(Release|Hotfix)\]/i.test(pr.title) || pr.base.ref !== pr.base.repo.default_branch;
              const closes = [...body.matchAll(CLOSES)];
              const fails = [];

              // 작업 종류 라벨: 제목 [Type]에 맞는 라벨 1개만 남김
              const LABELS = { feat: '⭐️ FEAT', fix: '🐛 FIX', hotfix: '🚑 HOTFIX', docs: '✏️ DOCS', refactor: '🛠️ REFACTOR',
                               style: '🧁 STYLE', test: '🔎 TEST', release: '🚀 RELEASE', chore: '🧹 CHORE' };
              const tm = pr.title.match(/^\[([A-Za-z]+)\]/);
              const want = tm && LABELS[tm[1].toLowerCase()];
              const have = pr.labels.map(l => l.name);
              for (const l of have.filter(x => Object.values(LABELS).includes(x) && x !== want)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: l }).catch(() => {});
              }
              if (want && !have.includes(want)) await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [want] });

              // Assignee: 비어 있으면 PR 작성자를 지정
              if (pr.assignees.length < 1 && pr.user.type !== 'Bot') {
                await github.rest.issues.addAssignees({ owner, repo, issue_number: n, assignees: [pr.user.login] });
                pr.assignees.push(pr.user);
              }

              // 대상 브랜치: 기본 브랜치가 아닌 main으로 보내는 PR은 dev(릴리스), hotfix/*에서만(release/* 브랜치는 쓰지 않음, conventions/git.md)
              const def = pr.base.repo.default_branch;
              if (pr.base.ref !== def && !(pr.head.ref === 'dev' || /^hotfix\//i.test(pr.head.ref))) {
                fails.push(`대상 브랜치는 ${def}(기능 PR). ${pr.base.ref}는 릴리스(dev)·hotfix/*만`);
              }

              // 제목 규칙: [Type] 내용, Type 9종(conventions/issue-pr.md "분류 기준")
              if (!/^\[(Feat|Fix|Hotfix|Docs|Refactor|Style|Test|Release|Chore)\]\s+\S/i.test(pr.title)) {
                fails.push('제목은 [Feat]·[Fix]·[Hotfix]·[Docs]·[Refactor]·[Style]·[Test]·[Release]·[Chore] 중 하나로 시작');
              }

              if (exempt ? closes.length > 1 : closes.length !== 1) {
                fails.push(exempt ? 'Closes 이슈는 0~1개' : 'Closes 이슈 1개 필요');
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: n });
              // 팀 리뷰 요청은 저장소 토큰에 requested_teams로 보이지 않을 수 있어 타임라인의 요청·취소 기록으로도 셈
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number: n });
              const req = new Map();
              for (const e of timeline) {
                if (e.event !== 'review_requested' && e.event !== 'review_request_removed') continue;
                const key = e.requested_team ? 'team:' + e.requested_team.slug : 'user:' + (e.requested_reviewer?.login || '');
                req.set(key, e.event === 'review_requested');
              }
              const hasReviewer = pr.requested_reviewers.length > 0 || pr.requested_teams.length > 0
                || [...req.values()].some(Boolean)
                || reviews.some(r => r.user && r.user.login !== pr.user.login);
              if (!hasReviewer) fails.push('Reviewer 지정 필요');
              if (pr.assignees.length < 1) fails.push('Assignee 지정 필요');

              const prComments = await comments(owner, repo, n);
              const prMiss = uncovered(items(pr.body), reasons(prComments));
              if (prMiss.length) fails.push(`PR 미체크 항목 ${prMiss.length}개에 사유 없음`);

              let issueMiss = [];
              if (closes.length === 1) {
                const [, o, r, num] = closes[0];
                const io = o || owner, ir = r || repo;
                const { data: issue } = await github.rest.issues.get({ owner: io, repo: ir, issue_number: Number(num) });
                const issueComments = await comments(io, ir, Number(num));
                issueMiss = uncovered(items(issue.body), reasons([...prComments, ...issueComments]));
                if (issueMiss.length) fails.push(`연결 이슈 미체크 항목 ${issueMiss.length}개에 사유 없음`);
              }

              const ok = fails.length === 0;
              await core.summary
                .addHeading(`PR #${n} pr-rules: ${ok ? '통과' : '실패'}`, 3)
                .addList(ok ? ['모든 규칙 충족'] : fails)
                .addList([...prMiss.map(i => `PR 미체크: ${i}`), ...issueMiss.map(i => `이슈 미체크: ${i}`)])
                .write();
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, context: 'pr-rules',
                state: ok ? 'success' : 'failure',
                description: (ok ? '모든 규칙 충족' : fails.join(', ')).slice(0, 140),
                target_url: runUrl,
              });
            }
