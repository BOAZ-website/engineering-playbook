# PR 검사 호출 파일 견본(.github/workflows/pr-check.yml로 복사). 원본 변경은 @v1 태그 이동으로 반영됨
name: PR Check
on:
  pull_request: { types: [opened, edited, synchronize, reopened, ready_for_review, review_requested, review_request_removed, assigned, unassigned] }
  pull_request_review: { types: [submitted, dismissed] }
  issue_comment: { types: [created, edited, deleted] }
  issues: { types: [edited] }
permissions: { contents: read, pull-requests: read, issues: read, statuses: write }
concurrency: { group: "pr-check-${{ github.event.pull_request.number || github.event.issue.number }}", cancel-in-progress: true }
jobs:
  check:
    uses: BOAZ-website/engineering-playbook/.github/workflows/pr-check.yml@v1
